<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Diccionario</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Dic">
<meta name="theme-color" content="#c1440e">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f0;--surface:#fff9f2;--border:#e8d8c4;
  --terracotta:#c1440e;--tl:#e05a20;--gold:#b07d3a;
  --text:#2a1f14;--muted:#8a7060;--green:#3a7d5a;--blue:#2d5f8a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;font-size:16px;}

header{background:var(--terracotta);padding:14px 20px 10px;position:relative;overflow:hidden;flex-shrink:0;}
header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 18px,rgba(255,255,255,.04) 18px,rgba(255,255,255,.04) 36px);}
h1{font-family:'Playfair Display',serif;font-size:1.4rem;color:#fff;letter-spacing:.02em;position:relative;}
h1 span{font-style:italic;font-weight:400;opacity:.82;font-size:.85rem;display:block;margin-top:1px;}

.view-tabs{display:flex;gap:0;position:relative;margin-top:10px;}
.view-tab{flex:1;padding:9px 0;text-align:center;background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.75);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;transition:all .15s;}
.view-tab.on{background:var(--bg);color:var(--terracotta);}
.view-tab:first-child{margin-right:2px;}

.top-area{flex-shrink:0;background:var(--bg);padding:14px 16px 0;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(42,31,20,.06);margin-bottom:14px;}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tab{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:.85rem;cursor:pointer;color:var(--muted);transition:all .18s;min-height:40px;}
.tab.on{background:var(--terracotta);border-color:var(--terracotta);color:#fff;font-weight:500;}
.srow{display:flex;gap:10px;}
input.si{flex:1;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:1rem;background:var(--bg);color:var(--text);outline:none;min-height:48px;}
input.si:focus{border-color:var(--terracotta);}
input.si::placeholder{color:var(--muted);}

.accent-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.accent-btn{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--terracotta);font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.accent-btn:active{background:var(--terracotta);color:#fff;transform:scale(0.94);}

.btn{border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;transition:all .18s;min-height:48px;padding:0 20px;font-size:.95rem;}
.pri{background:var(--terracotta);color:#fff;}
.pri:active{background:var(--tl);}
.pri:disabled{opacity:.5;cursor:not-allowed;}
.sm{min-height:40px;padding:0 14px;font-size:.85rem;border-radius:8px;}
.out{background:transparent;border:1.5px solid var(--border);color:var(--muted);}
.out:active{border-color:var(--terracotta);color:var(--terracotta);}
.sav{background:var(--gold);color:#fff;}
.sav:active{background:#c48f45;}
.sav.done{background:var(--green);cursor:default;}
.st{font-size:.88rem;padding:10px 14px;border-radius:8px;margin-top:10px;display:none;}
.st.err{background:#fde8e4;color:#c0392b;display:block;}
.st.ld{background:#fff3e8;color:var(--gold);display:block;}

.rc{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(42,31,20,.06);margin-bottom:14px;animation:fi .3s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.rt{padding:16px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--border);}
.rw{flex:1;}
.ew{font-family:'Playfair Display',serif;font-size:2rem;color:var(--terracotta);line-height:1.2;}
.wt{font-size:.8rem;color:var(--muted);font-style:italic;margin-top:2px;}
.spk-btns{display:flex;gap:8px;flex-direction:column;align-items:center;flex-shrink:0;}
.sb{background:var(--terracotta);border:none;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .18s;}
.sb svg{width:20px;height:20px;fill:white;}
.sb.slow{background:var(--blue);font-size:1.2rem;}
.trs{padding:12px 16px;}
.tr{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);}
.tr:last-child{border-bottom:none;}
.bd{font-size:.72rem;font-weight:500;padding:3px 9px;border-radius:10px;flex-shrink:0;letter-spacing:.04em;text-transform:uppercase;}
.ben{background:#ddeaf7;color:var(--blue);}
.bzh{background:#ddf0e7;color:var(--green);}
.tt{font-size:1.05rem;color:var(--text);}
.ra{padding:12px 16px;background:rgba(232,216,196,.2);}
.ra-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.ra-row:last-child{margin-bottom:0;}
.field-label{font-size:.85rem;color:var(--muted);white-space:nowrap;min-width:44px;}
select.pos-select{flex:1;min-width:100px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;min-height:40px;}
input.tag-input{flex:1;min-width:140px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;min-height:40px;}

.conj-box{margin:0 16px 14px;border:1.5px dashed var(--blue);border-radius:10px;padding:12px 14px;background:#f2f7fb;}
.conj-title{font-size:.85rem;font-weight:500;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.conj-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.conj-table td{padding:4px 6px;border-bottom:1px dashed var(--border);}
.conj-table td.pron{color:var(--muted);white-space:nowrap;}
.conj-tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.conj-tab{padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:#fff;font-size:.75rem;cursor:pointer;color:var(--muted);}
.conj-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.conj-extra{font-size:.78rem;color:var(--muted);margin-top:8px;}

.grammar-box{margin:0 16px 14px;border:1.5px dashed var(--gold);border-radius:10px;padding:12px 14px;background:#fdf6ea;}
.grammar-title{font-size:.85rem;font-weight:500;color:var(--gold);margin-bottom:6px;}
.grammar-body{font-size:.85rem;color:var(--text);line-height:1.6;white-space:pre-wrap;}

.vocab-area{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch;}
.sec{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--text);margin:14px 0 10px;display:flex;align-items:center;gap:10px;}
.cp{background:var(--terracotta);color:#fff;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;padding:2px 10px;border-radius:12px;}

.filter-label{font-size:.72rem;color:var(--muted);margin:8px 0 5px;font-weight:500;}
.tag-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.tag-btn{padding:6px 14px;border-radius:16px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;color:var(--muted);transition:all .18s;min-height:34px;}
.tag-btn.on{background:var(--terracotta);border-color:var(--terracotta);color:#fff;font-weight:500;}
.tag-btn.pos-btn.on{background:var(--blue);border-color:var(--blue);}

.lc{display:flex;gap:10px;margin:12px 0;align-items:center;}
input.ls{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;background:var(--bg);color:var(--text);outline:none;min-height:44px;}
input.ls:focus{border-color:var(--terracotta);}

#vl{display:flex;flex-direction:column;gap:10px;}
.vi{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.vi-main{padding:14px 16px;display:flex;align-items:center;gap:12px;}
.ves{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--terracotta);min-width:100px;flex-shrink:0;}
.vd{width:1px;height:38px;background:var(--border);flex-shrink:0;}
.vt{flex:1;min-width:0;}
.ven{font-size:.9rem;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vzh{font-size:.9rem;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vbadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.vpos{display:inline-block;font-size:.68rem;padding:2px 8px;background:#ddeaf7;color:var(--blue);border-radius:10px;}
.vtag{display:inline-block;font-size:.68rem;padding:2px 8px;background:#fce8e0;color:var(--terracotta);border-radius:10px;}

.vi-actions{border-top:1px solid var(--border);background:rgba(232,216,196,.15);display:flex;gap:0;}
.va-btn{flex:1;padding:10px 0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);gap:4px;border-right:1px solid var(--border);transition:background .15s;flex-direction:column;min-height:52px;}
.va-btn:last-child{border-right:none;}
.va-btn:active{background:rgba(193,68,14,.08);}
.va-btn svg{width:17px;height:17px;}
.va-btn.del-vi:active{color:#c0392b;}
.va-btn.tag-vi:active{color:var(--gold);}
.va-btn.slow-vi:active{color:var(--blue);}
.va-btn span{font-size:.68rem;}

.es{text-align:center;padding:32px 20px;color:var(--muted);border:2px dashed var(--border);border-radius:12px;}
.es .ei{font-size:2.4rem;margin-bottom:10px;}
.es p{font-size:.92rem;line-height:1.7;}

.migrate-banner{background:#fdf6ea;border:2px dashed var(--gold);border-radius:12px;padding:16px;margin-bottom:14px;font-size:.88rem;line-height:1.7;color:var(--text);}
.migrate-banner b{color:var(--gold);}

.modal-bg{position:fixed;inset:0;background:rgba(42,31,20,.5);z-index:900;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 20px 32px;width:100%;max-height:78vh;overflow-y:auto;box-shadow:0 -4px 24px rgba(42,31,20,.18);}
.modal h3{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--text);margin-bottom:14px;}
.modal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.modal-tag{padding:8px 16px;border-radius:16px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;color:var(--muted);transition:all .15s;min-height:40px;}
.modal-tag.sel{background:var(--terracotta);border-color:var(--terracotta);color:#fff;}
.modal-new{display:flex;gap:8px;margin-bottom:16px;}
.modal-new input{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;min-height:46px;}
.modal-actions{display:flex;gap:10px;}
.modal-actions .btn{flex:1;min-height:48px;}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:#2a1f14;color:#fff;padding:12px 22px;border-radius:12px;font-size:.9rem;opacity:0;transition:all .25s;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#view-conj{display:none;flex:1;overflow-y:auto;padding:14px 16px 24px;}
.conj-search-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(42,31,20,.06);margin-bottom:14px;}
.conj-result{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.conj-result .ew{font-size:1.6rem;}
.conj-badge{display:inline-block;font-size:.72rem;padding:3px 10px;border-radius:12px;background:#ddf0e7;color:var(--green);margin-left:8px;vertical-align:middle;}
.conj-badge.irr{background:#fde8e4;color:#c0392b;}
.conj-full-table{width:100%;border-collapse:collapse;margin-top:10px;}
.conj-full-table th{text-align:left;padding:8px 8px;background:var(--bg);color:var(--muted);font-size:.78rem;font-weight:500;}
.conj-full-table td{padding:8px 8px;border-bottom:1px dashed var(--border);font-size:.92rem;}
.conj-full-table td.pron{color:var(--muted);font-size:.82rem;white-space:nowrap;}
.tense-nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px;}
.tense-btn{padding:6px 12px;border-radius:14px;border:1.5px solid var(--border);background:transparent;font-size:.78rem;cursor:pointer;color:var(--muted);}
.tense-btn.on{background:var(--terracotta);border-color:var(--terracotta);color:#fff;}
.non-fin{display:flex;gap:16px;margin-top:10px;font-size:.85rem;}
.non-fin span b{color:var(--terracotta);}

@media(min-width:600px){
  html,body{overflow:auto;height:auto;}
  .top-area{padding:20px 0 0;max-width:760px;margin:0 auto;width:100%;}
  .vocab-area{overflow:visible;max-width:760px;margin:0 auto;width:100%;padding-bottom:60px;}
  #view-conj{max-width:760px;margin:0 auto;width:100%;overflow:visible;}
  .vi-main{padding:14px 18px;}
  .vi-actions{display:none;}
  .vi-main .va-row{display:flex;gap:6px;flex-shrink:0;}
  .ib{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--muted);}
  .ib:hover{border-color:var(--terracotta);color:var(--terracotta);}
  .ib.del:hover{border-color:#c0392b;color:#c0392b;}
  .ib svg{width:16px;height:16px;}
  .modal-bg{align-items:center;}
  .modal{border-radius:14px;max-width:420px;max-height:80vh;}
  #toast{left:auto;right:24px;transform:translateY(10px);}
  #toast.show{transform:translateY(0);}
}
</style>
</head>
<body>

<header>
  <h1>Mi Diccionario <span>我的西班牙文字典</span></h1>
  <div class="view-tabs">
    <button class="view-tab on" id="vtab-dict">📖 字典</button>
    <button class="view-tab" id="vtab-conj">🔀 動詞變化</button>
  </div>
</header>

<div class="top-area" id="view-dict">
  <div class="card">
    <div class="tabs">
      <button class="tab on" data-m="es-zh">🇪🇸 西文→中／英</button>
      <button class="tab" data-m="zh-es">🇹🇼 中文→西文</button>
      <button class="tab" data-m="en-es">🇬🇧 英文→西文</button>
    </div>
    <div class="srow">
      <input class="si" id="qi" type="text" placeholder="輸入西班牙文…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn pri" id="qb">查詢</button>
    </div>
    <div class="accent-row" id="accent-row-1"></div>
    <div class="st" id="st"></div>
  </div>
  <div id="ra"></div>
</div>

<div class="vocab-area" id="vocab-area">
  <div class="sec">我的單字本 <span class="cp" id="vc">0</span></div>
  <div id="migrate-banner-wrap"></div>

  <div class="filter-label">詞性篩選</div>
  <div class="tag-bar" id="pos-bar">
    <button class="tag-btn pos-btn on" data-pos="__all__">全部</button>
  </div>
  <div class="filter-label">主題標籤篩選</div>
  <div class="tag-bar" id="tag-bar">
    <button class="tag-btn on" data-tag="__all__">全部</button>
  </div>

  <div class="lc">
    <input class="ls" id="ls" type="text" placeholder="搜尋已儲存的單字…" autocorrect="off" spellcheck="false">
    <button class="btn out sm" id="eb">📤 CSV</button>
  </div>
  <div id="vl"><div class="es"><div class="ei">⏳</div><p>載入中…</p></div></div>
</div>

<div id="view-conj">
  <div class="conj-search-card">
    <div class="srow">
      <input class="si" id="conj-input" type="text" placeholder="輸入西班牙文動詞原形，例如 hablar" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn pri" id="conj-btn">查詢</button>
    </div>
    <div class="accent-row" id="accent-row-2"></div>
    <div class="st" id="conj-st"></div>
  </div>
  <div id="conj-result"></div>
  <div id="conj-grammar"></div>
</div>

<div class="modal-bg" id="tag-modal" style="display:none;">
  <div class="modal">
    <h3>🏷️ 選擇或新增主題標籤</h3>
    <div class="modal-tags" id="modal-tags"></div>
    <div class="modal-new">
      <input type="text" id="new-tag-input" placeholder="輸入新標籤…">
      <button class="btn pri sm" id="add-tag-btn">新增</button>
    </div>
    <div class="modal-actions">
      <button class="btn out" id="modal-cancel">取消</button>
      <button class="btn pri" id="modal-confirm">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var POS_OPTIONS = ['名詞','動詞','形容詞','副詞','介係詞','連接詞','代名詞','冠詞','數詞','感嘆詞','片語'];
var ACCENT_CHARS = ['á','é','í','ó','ú','ñ','ü','¿','¡'];

var mode = 'es-zh';
var cache = [];
var activeTag = '__all__';
var activePos = '__all__';
var modalId = null;
var modalSel = null;
var needsMigration = false;

window.onload = function(){
  buildAccentRow('accent-row-1', 'qi');
  buildAccentRow('accent-row-2', 'conj-input');
  loadWords();
};

function buildAccentRow(containerId, targetInputId){
  var c = document.getElementById(containerId);
  ACCENT_CHARS.forEach(function(ch){
    var b = document.createElement('button');
    b.className = 'accent-btn';
    b.textContent = ch;
    b.type = 'button';
    b.onclick = function(){ insertAtCursor(targetInputId, ch); };
    c.appendChild(b);
  });
}

function insertAtCursor(inputId, ch){
  var el = document.getElementById(inputId);
  if (!el) return;
  var start = el.selectionStart != null ? el.selectionStart : el.value.length;
  var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
  el.value = el.value.slice(0, start) + ch + el.value.slice(end);
  el.focus();
  el.selectionStart = el.selectionEnd = start + ch.length;
}

document.getElementById('vtab-dict').onclick = function(){ switchView('dict'); };
document.getElementById('vtab-conj').onclick = function(){ switchView('conj'); };

function switchView(v){
  document.getElementById('vtab-dict').classList.toggle('on', v==='dict');
  document.getElementById('vtab-conj').classList.toggle('on', v==='conj');
  document.getElementById('view-dict').style.display = v==='dict' ? 'block' : 'none';
  document.getElementById('vocab-area').style.display = v==='dict' ? 'block' : 'none';
  document.getElementById('view-conj').style.display = v==='conj' ? 'block' : 'none';
}

function loadWords(){
  google.script.run
    .withSuccessHandler(function(res){
      needsMigration = res.needsMigration;
      cache = res.words || [];
      renderMigrateBanner();
      drawFilterBars();
      draw();
    })
    .withFailureHandler(function(){ draw(); })
    .getWords();
}

function renderMigrateBanner(){
  var wrap = document.getElementById('migrate-banner-wrap');
  if (!needsMigration) { wrap.innerHTML = ''; return; }
  wrap.innerHTML =
    '<div class="migrate-banner">' +
    '⚠️ <b>需要先執行一次資料遷移</b><br><br>' +
    '請到 Apps Script 編輯器：<br>' +
    '1. 上方函式下拉選單選擇 <b>migrateData</b><br>' +
    '2. 按執行（Run）鈕，並授權<br>' +
    '3. 完成後回到這裡重新整理頁面' +
    '</div>';
}

function allPosValues(){
  var set = {};
  cache.forEach(function(v){ if(v.pos) set[v.pos]=true; });
  return Object.keys(set);
}
function allTagValues(){
  var set = {};
  cache.forEach(function(v){
    (v.tags||'').split('、').forEach(function(t){ t=t.trim(); if(t) set[t]=true; });
  });
  return Object.keys(set);
}

function xlate(text, from, to, cb, fail){
  google.script.run.withSuccessHandler(cb).withFailureHandler(fail).translateText(text, from, to);
}

function search(){
  var q = document.getElementById('qi').value.trim();
  if (!q) return;
  var qb = document.getElementById('qb'), st = document.getElementById('st');
  qb.disabled = true; st.textContent = '翻譯中…'; st.className = 'st ld';
  document.getElementById('ra').innerHTML = '';

  function fail(){ st.textContent = '⚠️ 查詢失敗，請稍後再試。'; st.className = 'st err'; qb.disabled = false; }

  if (mode === 'es-zh') {
    xlate(q, 'es', 'en', function(r1){
      xlate(q, 'es', 'zh-CN', function(r2){
        showResult(q, r1.success?r1.text:'', r2.success?r2.text:'');
        st.className = 'st'; qb.disabled = false;
      }, fail);
    }, fail);
  } else if (mode === 'zh-es') {
    xlate(q, 'zh', 'es', function(r1){
      var es = r1.success ? r1.text : q;
      xlate(es, 'es', 'en', function(r2){
        showResult(es, r2.success?r2.text:'', q);
        st.className = 'st'; qb.disabled = false;
      }, fail);
    }, fail);
  } else {
    xlate(q, 'en', 'es', function(r1){
      var es = r1.success ? r1.text : q;
      xlate(es, 'es', 'zh-CN', function(r2){
        showResult(es, q, r2.success?r2.text:'');
        st.className = 'st'; qb.disabled = false;
      }, fail);
    }, fail);
  }
}

      '<div class="spk-btns">' +
        '<button class="sb" id="spk-n" title="正常速度">'+spkSVG()+'</button>' +
        '<button class="sb slow" id="spk-s" title="慢速">🐢</button>' +
      '</div>' +
    '</div>' +
    '<div class="trs">' +
      '<div class="tr"><span class="bd ben">EN</span><span class="tt">'+H(en)+'</span></div>' +
      '<div class="tr"><span class="bd bzh">中文</span><span class="tt">'+H(zh)+'</span></div>' +
    '</div>' +
    '<div class="ra">' +
      '<div class="ra-row">' +
        '<span class="field-label">詞性</span>' +
        '<select class="pos-select" id="save-pos"></select>' +
      '</div>' +
      '<div class="ra-row">' +
        '<span class="field-label">標籤</span>' +
        '<input type="text" class="tag-input" id="save-tag" placeholder="用「、」分隔，可留空">' +
      '</div>' +
      '<div class="ra-row">' +
        '<button class="btn sav'+(got?' done':'')+'" id="save-result-btn"'+(got?' disabled':'')+'>' +
          (got ? '✓ 已收錄' : '＋ 加入單字本') +
        '</button>' +

    '</div>';
  document.getElementById('ra').innerHTML = '';

  var sel = document.getElementById('save-pos');
  POS_OPTIONS.forEach(function(p){
    var o = document.createElement('option');
    o.value = p; o.textContent = p;
    sel.appendChild(o);
  });
  if (/^[a-záéíóúñü]+(ar|er|ir)$/i.test(es.trim())) sel.value = '動詞';

  document.getElementById('spk-n').onclick = function(){ speak(es, 1); };

function showInlineConjIfVerb(es){
  var infinitive = es.trim().split(/\s+/)[0].toLowerCase();
  google.script.run.withSuccessHandler(function(res){
    if (!res.success) return;
    var box = document.createElement('div');
    box.className = 'conj-box';
    box.innerHTML = renderConjBoxHtml(res);
    document.getElementById('ra').appendChild(box);
    bindConjTabEvents(box, res);
  }).withFailureHandler(function(){}).getConjugation(infinitive);
}

function showInlineGrammar(text){
  google.script.run.withSuccessHandler(function(notes){
    if (!notes || !notes.length) return;
    var box = document.createElement('div');
    box.className = 'grammar-box';
    box.innerHTML = notes.map(function(n){
      return '<div class="grammar-title">📘 '+H(n.title)+'</div><div class="grammar-body">'+H(n.body)+'</div>';
    }).join('<hr style="border:none;border-top:1px dashed var(--border);margin:10px 0;">');
    document.getElementById('ra').appendChild(box);
  }).withFailureHandler(function(){}).getGrammarNotes(text);
}

var CONJ_TENSES = [
  {key:'presente', label:'現在式'},
  {key:'preterito', label:'簡單過去式'},
  {key:'imperfecto', label:'未完成過去式'},
  {key:'futuro', label:'未來式'},
  {key:'condicional', label:'條件式'}
];

function renderConjBoxHtml(res){
  var html = '<div class="conj-title">🔀 動詞變化：'+H(res.infinitive)+(res.isIrregular?' <span style="color:#c0392b;">（不規則）</span>':'')+'</div>';
  html += '<div class="conj-tabs">';
  CONJ_TENSES.forEach(function(t, i){
    html += '<button class="conj-tab'+(i===0?' on':'')+'" data-tense="'+t.key+'">'+t.label+'</button>';
  });
  html += '</div>';
  html += '<div class="conj-table-wrap">'+renderConjTable(res, 'presente')+'</div>';
  html += '<div class="conj-extra">現在分詞：'+H(res.table.gerundio||'—')+'　過去分詞：'+H(res.table.participio||'—')+'</div>';
  return html;
}

function renderConjTable(res, tense){
  var forms = res.table[tense] || [];
  var rows = res.pronouns.map(function(p, i){
    return '<tr><td class="pron">'+H(p)+'</td><td>'+H(forms[i]||'—')+'</td></tr>';
  }).join('');
  return '<table class="conj-table"><tbody>'+rows+'</tbody></table>';
}

function bindConjTabEvents(box, res){
  var tabs = box.querySelectorAll('.conj-tab');
  tabs.forEach(function(tab){
    tab.onclick = function(){
      tabs.forEach(function(t){ t.classList.remove('on'); });
      tab.classList.add('on');
      box.querySelector('.conj-table-wrap').innerHTML = renderConjTable(res, tab.dataset.tense);
    };
  });
}

function norm(s){ return s ? s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() : ''; }

    var qOk = !q || norm(v.es).includes(q) || norm(v.en||'').includes(q) || (v.zh||'').includes(q);

function csv(){

    cache.map(function(v){ return [v.es||'', v.en||'', v.zh||'', v.pos||'', v.tags||'']; })

function speak(text, rate){
  google.script.run
    .withSuccessHandler(function(dataUrl){
      var audio = new Audio(dataUrl);
      audio.playbackRate = rate;
      audio.play().catch(function(){ fallback(text, rate); });
    })
    .withFailureHandler(function(){ fallback(text, rate); })
    .getAudioBase64(text);
}
function fallback(text, rate){
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES'; u.rate = rate || 0.85;
  window.speechSynthesis.speak(u);
}

  document.getElementById('conj-grammar').innerHTML = '';

  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false;

        st.textContent = '⚠️ 查不到這個動詞，請確認輸入的是「原形動詞」（例如 hablar、comer、vivir），且拼字含重音正確。';

        return;

function renderFullConjResult(res){
  var wrap = document.getElementById('conj-result');
  var html = '<div class="conj-result">' +
    '<div class="ew">'+H(res.infinitive)+
    (res.isIrregular ? '<span class="conj-badge irr">不規則動詞</span>' : '<span class="conj-badge">規則動詞</span>') +
    '</div>';
  html += '<div class="tense-nav" id="tense-nav">';
  CONJ_ALL_TENSES.forEach(function(t, i){
    html += '<button class="tense-btn'+(i===0?' on':'')+'" data-tense="'+t.key+'">'+H(t.label)+'</button>';
  });
  html += '</div>';
  html += '<div id="full-conj-table">'+renderFullTable(res,'presente')+'</div>';
  html += '<div class="non-fin"><span><b>現在分詞</b> '+H(res.table.gerundio||'—')+'</span><span><b>過去分詞</b> '+H(res.table.participio||'—')+'</span></div>';
  html += '</div>';
  wrap.innerHTML = html;

  wrap.querySelectorAll('.tense-btn').forEach(function(btn){
    btn.onclick = function(){
      wrap.querySelectorAll('.tense-btn').forEach(function(b){ b.classList.remove('on'); });
      btn.classList.add('on');
      document.getElementById('full-conj-table').innerHTML = renderFullTable(res, btn.dataset.tense);
    };
  });
}

function renderFullTable(res, tense){
  var forms = res.table[tense] || [];
  var rows = res.pronouns.map(function(p,i){
    return '<tr><td class="pron">'+H(p)+'</td><td>'+H(forms[i]||'—')+
      '<button class="ib" style="width:26px;height:26px;display:inline-flex;margin-left:6px;vertical-align:middle;" onclick="speak(\''+escJs(forms[i]||'')+'\',1)">'+spkSVG()+'</button></td></tr>';
  }).join('');
  return '<table class="conj-full-table"><thead><tr><th>人稱</th><th>變化</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function loadConjGrammar(infinitive){
  google.script.run.withSuccessHandler(function(notes){
    if (!notes || !notes.length) return;
    document.getElementById('conj-grammar').innerHTML = notes.map(function(n){
      return '<div class="grammar-box"><div class="grammar-title">📘 '+H(n.title)+'</div><div class="grammar-body">'+H(n.body)+'</div></div>';
    }).join('');
  }).withFailureHandler(function(){}).getGrammarNotes(infinitive);
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}
function H(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
